<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <!-- Use Inter font for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Main Content -->
        <main class="main-content">
            <header>
                <h2>Home</h2>
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="What do you want to listen to?">
                </div>
                <a href="admin.html" class="btn-outline"
                    style="text-decoration: none; display: inline-block; padding: 8px 16px; border-radius: 4px;">Admin</a>
            </header>

            <div class="song-grid" id="songGrid">
                <!-- Songs will be populated here via JavaScript -->
            </div>
        </main>
    </div>

    <!-- Fixed Bottom Player Bar -->
    <div class="player-bar">
        <div class="now-playing">
            <img src="https://via.placeholder.com/56" alt="Cover" id="npCover" class="np-cover hidden">
            <div class="np-info">
                <h4 id="npTitle"></h4>
                <p id="npArtist"></p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="btn-icon" id="btnPrev" title="Previous"><i class="fas fa-step-backward"></i></button>
                <button class="btn-play-pause" id="btnPlayPause" title="Play"><i class="fas fa-play"
                        id="playIcon"></i></button>
                <button class="btn-icon" id="btnNext" title="Next"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="playback-bar">
                <span id="currentTime">0:00</span>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-handle" id="progressHandle"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="volume-control">
            <i class="fas fa-volume-up btn-icon" id="muteIcon" title="Mute"></i>
            <div class="volume-container" id="volumeContainer">
                <div class="volume-bar" id="volumeBar" style="width: 100%;"></div>
                <div class="volume-handle" id="volumeHandle" style="left: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioPlayer"></audio>

    <!-- Supabase JS Client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="app.js"></script>
</body>

</html>
